<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">混合具身 Agent 工作流</title>
  <desc id="desc">RoboDojo 公开相机和状态进入 Qwen，Qwen 可以请求 Astra 的规划或诊断建议，实际机器人动作仍由 Qwen 决定。原生评测器负责最终评分。</desc>
  <defs>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#159c9d" stroke-width="2"/></marker>
    <marker id="arrowOrange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#e77f46" stroke-width="2"/></marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#137a87" opacity=".11"/></pattern>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f4f7f4"/><rect width="1200" height="680" rx="28" fill="url(#dots)"/>

  <!-- paths deliberately never connect Astra to the robot -->
  <path d="M293 296H398" stroke="#159c9d" stroke-width="6" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M650 297H785" stroke="#159c9d" stroke-width="6" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M815 471C726 574 381 569 275 401" stroke="#159c9d" stroke-width="4" stroke-dasharray="10 10" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M555 214C590 113 724 103 773 146" stroke="#e77f46" stroke-width="4" stroke-dasharray="10 9" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M764 202C726 232 696 243 650 244" stroke="#e77f46" stroke-width="4" stroke-dasharray="10 9" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M519 467v49" stroke="#159c9d" stroke-width="3" stroke-dasharray="7 7" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M439 521v-55" stroke="#159c9d" stroke-width="3" stroke-dasharray="7 7" fill="none" marker-end="url(#arrowTeal)"/>

  <!-- public observations -->
  <g><rect x="56" y="218" width="237" height="193" rx="24" fill="#ffffff" stroke="#d6e8e5" stroke-width="2"/></g>
  <text x="82" y="258" font-family="sans-serif" font-size="23" font-weight="700" fill="#113447">公开观察</text>
  <g fill="#dcf4ef" stroke="#159c9d" stroke-width="3"><rect x="82" y="281" width="62" height="48" rx="9"/><rect x="158" y="281" width="48" height="48" rx="9"/><rect x="219" y="281" width="48" height="48" rx="9"/></g>
  <circle cx="113" cy="305" r="10" fill="#138d98"/><circle cx="182" cy="305" r="9" fill="#138d98"/><circle cx="243" cy="305" r="9" fill="#138d98"/>
  <text x="82" y="365" font-family="sans-serif" font-size="17" fill="#506c77">三相机 RGB · 机器人状态</text>
  <text x="82" y="386" font-family="sans-serif" font-size="15" fill="#79909a">不含隐藏奖励</text>

  <!-- Qwen -->
  <g><rect x="398" y="214" width="252" height="253" rx="28" fill="#103549"/></g>
  <rect x="423" y="239" width="56" height="56" rx="16" fill="#31c7ba"/>
  <path d="M438 267h24m-12-12v24" stroke="#0d3c49" stroke-width="5" stroke-linecap="round"/>
  <text x="495" y="276" font-family="sans-serif" font-size="33" font-weight="800" fill="#ffffff">Qwen</text>
  <text x="423" y="330" font-family="sans-serif" font-size="21" font-weight="700" fill="#d3f9f1">主决策者</text>
  <text x="423" y="364" font-family="sans-serif" font-size="17" fill="#b4d6d8">理解目标 · 选择证据</text>
  <text x="423" y="393" font-family="sans-serif" font-size="17" fill="#b4d6d8">决定动作 · 解释回执</text>
  <rect x="424" y="415" width="181" height="28" rx="14" fill="#225b66"/>
  <text x="439" y="435" font-family="sans-serif" font-size="14" font-weight="700" fill="#9cf4e3">机器人动作只从这里发出</text>

  <!-- bounded Astra -->
  <g><rect x="762" y="91" width="367" height="159" rx="24" fill="#fff1e6" stroke="#f2bd99" stroke-width="2"/></g>
  <circle cx="807" cy="133" r="19" fill="#e9834e"/><path d="M798 133h18m-9-9v18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="840" y="141" font-family="sans-serif" font-size="26" font-weight="800" fill="#8b462b">Astra 建议工具</text>
  <text x="789" y="183" font-family="sans-serif" font-size="18" fill="#955a41">任务计划 × 1　·　故障诊断 × 1</text>
  <text x="789" y="216" font-family="sans-serif" font-size="15" fill="#aa6c52">只给建议 · 不提交动作 · 不判成功</text>

  <!-- native simulator -->
  <g><rect x="785" y="290" width="344" height="203" rx="26" fill="#ffffff" stroke="#c5e3de" stroke-width="2"/></g>
  <text x="809" y="334" font-family="sans-serif" font-size="27" font-weight="800" fill="#113d4b">RoboDojo</text>
  <text x="809" y="363" font-family="sans-serif" font-size="16" fill="#64818a">原生执行与评分</text>
  <path d="M916 394l37 37 33-26 33 31" fill="none" stroke="#2dbdb0" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#137d89"><circle cx="918" cy="393" r="14"/><circle cx="952" cy="430" r="12"/><circle cx="985" cy="406" r="11"/></g>
  <rect x="818" y="451" width="279" height="24" rx="12" fill="#ddf3ee"/>
  <text x="843" y="469" font-family="sans-serif" font-size="14" font-weight="700" fill="#367c7e">动作回执 · 终止 · 原生分数</text>

  <!-- task image memory -->
  <g><rect x="377" y="516" width="292" height="116" rx="22" fill="#ecf9f5" stroke="#91dace" stroke-width="2"/></g>
  <rect x="398" y="539" width="67" height="57" rx="8" fill="#b1e5db" stroke="#3ea99e" stroke-width="2"/><path d="m406 583 18-18 13 10 13-17 8 25z" fill="#5db9ad"/>
  <text x="482" y="561" font-family="sans-serif" font-size="21" font-weight="700" fill="#14636c">任务级图像记忆</text>
  <text x="482" y="588" font-family="sans-serif" font-size="15" fill="#4c8288">子任务开始保存</text>
  <text x="482" y="611" font-family="sans-serif" font-size="15" fill="#4c8288">之后按 ID 回忆</text>
</svg>
